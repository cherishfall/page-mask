name: 功能建议 / Feature request
description: 提出新功能或改进建议 / Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        以下功能按设计不会提供：快捷键、全局总开关、预置站点规则、远程订阅、右键菜单、免保存的临时隐藏。
        By design, these will not be added: keyboard shortcuts, a global on/off switch, bundled site presets, remote subscriptions, context menu entries, and unsaved temporary hiding.
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法 / Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案 / Alternatives considered
