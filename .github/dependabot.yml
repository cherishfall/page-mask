version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 依赖均为精确版本，Dependabot 只改版本号不放宽区间
    versioning-strategy: increase
    open-pull-requests-limit: 10
    groups:
      vue:
        patterns: ['vue', '@vue/*', 'vue-tsc']
      vitest:
        patterns: ['vitest', '@vitest/*']
      wxt:
        patterns: ['wxt', '@wxt-dev/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
