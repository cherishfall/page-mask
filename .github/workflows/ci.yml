name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci 严格按 lockfile 安装，postinstall 会执行 wxt prepare 生成 .wxt/ 类型
      - run: npm ci

      - run: npm run compile

      - name: Unit tests (with coverage)
        run: npm test -- --coverage

      # 生产依赖漏洞审计必须走官方源（镜像不支持 audit 接口）
      - name: Audit production dependencies
        run: npm audit --omit=dev --registry=https://registry.npmjs.org

      - name: Third-party notices up to date
        run: node scripts/gen-notices.mjs --check

      - run: npm run zip

      - name: Package gate
        run: npm run check:package

      - uses: actions/upload-artifact@v7
        with:
          name: page-mask-chrome-zip
          path: .output/*-chrome.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
